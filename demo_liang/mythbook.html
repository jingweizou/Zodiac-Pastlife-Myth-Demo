<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zodiac Pastlife Myth - Interactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #090b1a;
      --bg2: #19142e;
      --gold: #d9b56f;
      --ink: #efe7d5;
      --soft: #bda983;
      --line: rgba(217,181,111,0.35);
      --panel: rgba(12, 12, 22, 0.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif SC", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -20%, #2a214d 0%, transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      line-height: 1.95;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      backdrop-filter: blur(4px);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: var(--soft); font-size: 14px; }
    .field input, .field select {
      width: 100%;
      background: #0f1328;
      border: 1px solid #3c355d;
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
    }
    .btn-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--gold);
      background: #2b2346;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: inherit;
    }
    header { text-align: center; margin: 12px 0 20px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 50px);
      background: linear-gradient(90deg, #f4e6c7, #d9b56f, #f4e6c7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }
    .meta {
      margin: 10px 0 0;
      color: var(--soft);
      font-size: 15px;
    }
    section {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      background: rgba(7, 8, 16, 0.45);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--gold);
      border-left: 3px solid var(--gold);
      padding-left: 10px;
    }
    .story p, .poem p { margin: 0 0 10px; }
    .closing {
      text-align: center;
      color: var(--soft);
      margin-top: 18px;
      font-style: italic;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="grid">
        <div class="field">
          <label>姓名</label>
          <input id="name" placeholder="例如：梁若星" value="梁若星" />
        </div>
        <div class="field">
          <label>星座</label>
          <select id="zodiac">
            <option>白羊座</option><option>金牛座</option><option>双子座</option><option>巨蟹座</option>
            <option>狮子座</option><option>处女座</option><option>天秤座</option><option selected>天蝎座</option>
            <option>射手座</option><option>摩羯座</option><option>水瓶座</option><option>双鱼座</option>
          </select>
        </div>
        <div class="field">
          <label>生日</label>
          <input id="birthday" type="date" value="1998-11-02" />
        </div>
        <div class="field">
          <label>三个关键词（逗号分隔）</label>
          <input id="keywords" placeholder="例如：冷静,执拗,温柔" value="冷静,执拗,温柔" />
        </div>
      </div>
      <div class="btn-row">
        <button id="generateBtn">生成神话</button>
        <button id="copyBtn" type="button">复制全文</button>
      </div>
    </div>

    <header>
      <h1 id="title">天蝎座前世神话</h1>
      <p class="meta" id="meta">姓名：梁若星 ｜ 生日：1998-11-02 ｜ 关键词：冷静、执拗、温柔</p>
    </header>

    <section class="story" id="story"></section>

    <section class="poem">
      <h2>命运预言</h2>
      <div id="poem"></div>
    </section>

    <p class="closing" id="closing">愿你此生所有深情，皆有归岸。</p>
  </div>

  <script>
    const zodiacMap = {
      "白羊座": "焰心开路者", "金牛座": "大地守藏者", "双子座": "双镜传信者", "巨蟹座": "潮汐护巢者",
      "狮子座": "曜火领航者", "处女座": "星纹织序者", "天秤座": "天衡裁光者", "天蝎座": "夜渊守誓者",
      "射手座": "远穹逐焰者", "摩羯座": "寒峰立誓者", "水瓶座": "风纪启明者", "双鱼座": "梦海渡灵者"
    };

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
    }

    function generate() {
      const name = (document.getElementById('name').value || '无名旅人').trim();
      const zodiac = document.getElementById('zodiac').value;
      const birthday = document.getElementById('birthday').value || '未知';
      const kwRaw = (document.getElementById('keywords').value || '').split(/[，,]/).map(s => s.trim()).filter(Boolean);
      const kw = [kwRaw[0] || '冷静', kwRaw[1] || '执拗', kwRaw[2] || '温柔'];
      const role = zodiacMap[zodiac] || '星海行者';

      document.getElementById('title').textContent = `${zodiac}前世神话`;
      document.getElementById('meta').textContent = `姓名：${name} ｜ 生日：${birthday} ｜ 关键词：${kw.join('、')}`;

      const story = [
        `太初星海未分昼夜时，北天司命阙曾记录一则命辞："${role}，以${kw[0]}破劫，以${kw[1]}守誓，以${kw[2]}照人。" 那道命辞，正落在你的前世——${name}。`,
        `第一重试炼名为“静潮”。黑潮压境，万军先乱。你却先听潮声、辨回拍，以${kw[0]}找出潮核，一击止乱。众人这才明白：真正的力量，不在先出手，而在先看清。`,
        `第二重试炼名为“逆碑”。天律崩裂，诸神劝退。你背着雷火拾回碎碑，以近乎执念的${kw[1]}把秩序拼回人间。你不争名，只争“该守住的东西，不能在我手里失守”。`,
        `第三重试炼名为“忘川灯”。桥头幼魂惧黑，你撕袍作灯芯，以心火点灯。那一夜史官没记你的战功，却有无数迟归者记住了你的${kw[2]}。你终于懂得，最强的人，不止会赢，也会留灯。`,
        `当终局命诏降下——“神阶可留，所爱将寂；若改命，须舍神名”——你选择了后者。于是今生的你，依旧带着前世烙印：外冷而稳、认定便深、沉默却有光。命运并未离开，它在你每次抉择里，温柔认出你。`
      ];

      document.getElementById('story').innerHTML = `<h2>前世传说</h2>${story.map(p => `<p>${esc(p)}</p>`).join('')}`;

      const poem = [
        `${zodiac}垂辉，旧誓未冷，`,
        `${name}执心，仍照长夜灯。`,
        `若问来途何处逢，`,
        `${kw[0]}为刃，${kw[2]}为风。`
      ];
      document.getElementById('poem').innerHTML = poem.map(line => `<p>${esc(line)}</p>`).join('');
      document.getElementById('closing').textContent = `愿 ${name} 此生所有深情，皆有归岸。`;
    }

    function copyAll() {
      const title = document.getElementById('title').innerText;
      const meta = document.getElementById('meta').innerText;
      const story = Array.from(document.querySelectorAll('#story p')).map(p => p.innerText).join('\n\n');
      const poem = Array.from(document.querySelectorAll('#poem p')).map(p => p.innerText).join('\n');
      const closing = document.getElementById('closing').innerText;
      const text = `${title}\n${meta}\n\n${story}\n\n命运预言\n${poem}\n\n${closing}`;
      navigator.clipboard.writeText(text).then(() => alert('已复制全文')).catch(() => alert('复制失败，请手动复制'));
    }

    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('copyBtn').addEventListener('click', copyAll);
    generate();
  </script>
</body>
</html>
